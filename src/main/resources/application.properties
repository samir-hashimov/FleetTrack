# =============================================================================
# FleetTrack - Vehicle Fleet Management System
# =============================================================================

spring.application.name=FleetTrack

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server.port=8080
server.servlet.context-path=/api

# -----------------------------------------------------------------------------
# PostgreSQL DataSource
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=FleetTrackHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.time-zone=UTC

# -----------------------------------------------------------------------------
# Flyway
# -----------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# -----------------------------------------------------------------------------
# Redis
# -----------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=60000ms
spring.data.redis.database=0
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

fleettrack.cache.vehicle-summary-ttl=300
fleettrack.cache.driver-summary-ttl=300

# -----------------------------------------------------------------------------
# JWT Security
# -----------------------------------------------------------------------------
fleettrack.jwt.secret=${JWT_SECRET}
fleettrack.jwt.expiration-ms=86400000

# -----------------------------------------------------------------------------
# Rate Limiting (Bucket4j)
# -----------------------------------------------------------------------------
fleettrack.rate-limit.capacity=100
fleettrack.rate-limit.refill-tokens=100
fleettrack.rate-limit.refill-duration-minutes=1

# -----------------------------------------------------------------------------
# Scheduler
# -----------------------------------------------------------------------------
fleettrack.scheduler.maintenance-check-cron=0 0 6 * * *
fleettrack.scheduler.maintenance-alert-days-ahead=7

# -----------------------------------------------------------------------------
# Swagger / OpenAPI
# -----------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false
springdoc.swagger-ui.persist-authorization=true

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.com.fleettrack=INFO
logging.level.org.springframework.security=WARN