spring.application.name=FleetTrack-Test

spring.datasource.url=jdbc:h2:mem:fleettrack;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=false

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

spring.cache.type=simple

fleettrack.jwt.secret=TestSecretKeyForFleetTrackApplicationTests123456
fleettrack.jwt.expiration-ms=3600000


fleettrack.rate-limit.capacity=1000
fleettrack.rate-limit.refill-tokens=1000
fleettrack.rate-limit.refill-duration-minutes=1

fleettrack.cache.vehicle-summary-ttl=60
fleettrack.cache.driver-summary-ttl=60

fleettrack.scheduler.maintenance-check-cron=0 0 6 * * *
fleettrack.scheduler.maintenance-alert-days-ahead=7
